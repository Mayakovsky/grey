openapi: 3.1.0
info:
  title: Whitepaper Grey API
  version: 1.0.0
  description: >
    HTTP contract for Whitepaper Grey's v1 offerings. Every response is a
    GreyResponseEnvelope wrapping exactly one of `payload` / `error`. Authored in
    Movement 2.5 (schema layer); routes are placeholders that Movement 3 (grey-core)
    is authoritative for and may relocate. x402 payment integration is Movement 5;
    this document declares the payment CONTRACT only, not its implementation.
    Bazaar discovery metadata (E1-B) is NOT hand-mirrored here (Invariant #33 —
    single source, no per-platform metadata): every 402 response's `accepts[].extra.bazaar`
    and `GET /v1/discovery/services` project the same @grey/schemas/evaluationKit source live.
  contact:
    email: grey@whitepapergrey.com
  x-guidance: >
    Unpaid requests to /v1/offerings/* return HTTP 402 with an x402 payment challenge
    (see x-payment-info per operation and the x402PaymentRequired security scheme below).
  # SELFHOST-DISCOVERY-KOV-directive.md item 1/4: per @agentcash/discovery's own
  # docs/SPECIFICATION.md §8 (the runtime x402scan/AgentCash actually execute), this is the
  # canonical way to point a crawler at freeform agent guidance without bloating discovery.
  x-agentcash-guidance:
    llmsTxtUrl: https://whitepapergrey.com/llms.txt
servers:
  # SELFHOST-DISCOVERY finding: this previously pointed at the marketing site (whitepapergrey.com),
  # not the domain these paths actually live on. Cosmetic for x402scan/AgentCash specifically (their
  # discovery runtime resolves resource origin from wherever /openapi.json was actually fetched,
  # not this field — confirmed by reading @agentcash/discovery's dist: `servers[]` only contributes
  # an optional base PATH prefix) but still a real correctness bug for anyone reading the spec
  # itself, so fixed here.
  - url: https://api.whitepapergrey.com
    description: Live domain (native x402 + free resources)
  - url: http://localhost:3002
    description: Local dev (GREY_CORE_PORT)

components:
  securitySchemes:
    x402PaymentRequired:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: |
        x402 payment authorization (NOT an API key — see semantic note below).

        Clients receive HTTP 402 with a PaymentRequirements body specifying
        maxAmountRequired, payTo, asset, network, expiresAt, and nonce.
        Clients sign an EIP-712 payment authorization and submit it in the
        X-PAYMENT header (base64-encoded JSON) on retry. Server validates
        the signature, broadcasts the payment, returns the API response.

        Semantic note: this is per-request payment, not persistent
        authentication. OpenAPI 3.1 has no native payment scheme; apiKey
        is used for tooling compatibility (codegen header recognition).
        Authoritative protocol details in x-x402-* extensions below.

        Protocol spec: https://x402.org
      x-x402-spec-version: "1"
      x-x402-protocol-url: "https://x402.org"
      x-x402-network: "base-mainnet"
      x-x402-asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      x-x402-scheme: "exact"
  schemas:
    GreyResponseEnvelope:
      $ref: ../src/responses/v1/envelope.schema.json

paths:
  /v1/offerings/legitimacy_scan:
    post:
      operationId: legitimacyScan
      summary: Project Legitimacy Scan
      description: "Path placeholder; M3-authoritative. Cache or live L1."
      security: [{ x402PaymentRequired: [] }]
      x-x402-pricing: "0.25"
      x-payment-info:
        price: { mode: fixed, currency: USD, amount: "0.25" }
        protocols: [{ x402: {} }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token_address: { type: string }
                project_name: { type: string }
              required: [token_address]
      responses:
        "200":
          description: GreyResponseEnvelope with a LegitimacyScanResponse payload.
          content:
            application/json:
              schema:
                $ref: ../src/responses/v1/envelope.schema.json
        "402":
          description: Payment required (x402 challenge).

