      description: "Path placeholder; M3-authoritative. Cache or live L1+L2."
      security: [{ x402PaymentRequired: [] }]
      x-x402-pricing: "1.50"
      x-payment-info:
        price: { mode: fixed, currency: USD, amount: "1.50" }
        protocols: [{ x402: {} }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token_address: { type: string }
                project_name: { type: string }
                document_url: { type: string }
              required: [token_address]
      responses:
        "200":
          description: GreyResponseEnvelope with a VerifyWhitepaperResponse payload.
          content:
