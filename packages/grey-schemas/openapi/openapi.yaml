  # SELFHOST-DISCOVERY finding: /v1/offerings/daily_tech_brief REMOVED from this document.
  # daily_tech_brief is NOT in grey-core's routes/offerings.ts PAID array (held back entirely per
  # BION-DIRECTIVE-62 — not-yet-offered, same posture as the two free resources below being
  # enabled:false would be, not a priced gap) — so the route does not exist and a real probe gets
  # a plain 404, not a 402. Documenting it here would hand x402scan/AgentCash a guaranteed
  # "Expected 402, got 404" failure on this JSON once /openapi.json (probes.ts) starts serving it.
  # PAID is the single reachability source of truth (offerings.ts's own header comment); this
  # document should only list what that array actually contains. Re-add this path (with
  # x-payment-info) the same day daily_tech_brief is added back to PAID — not before.

  /v1/resources/daily_greenlight_list:
    get:
      operationId: dailyGreenlightList
      summary: Daily Greenlight List (free resource)
      description: "Path placeholder; M3-authoritative. Free — no x402 payment required."
      security: []
      responses:
        "200":
          description: GreyResponseEnvelope with a DailyGreenlightListResponse payload.
          content:
            application/json:
              schema:
                $ref: ../src/responses/v1/envelope.schema.json

  /v1/resources/scam_alert_feed:
    get:
