packages:
  - "packages/*"
  - "adapters/*"

# pnpm 11 blocks dependency build/postinstall scripts by default. Approve each
# one explicitly here (never blanket approval). Inspected + justified 2026-06-08:
#
#   esbuild — postinstall installs/links esbuild's platform-native binary
#     (esbuild = JS wrapper + native exe; without it esbuild cannot run).
#     Pulled in transitively by vitest -> vite -> esbuild.
#
#   playwright-core — M3.5 discovery port: HeadlessBrowserResolver dynamically
#     imports('playwright-core') for SPA/headless whitepaper resolution (Q2a ruling).
#     Inspected 2026-06-15: playwright-core ships the driver + JS; browser binaries are
#     installed out-of-band (npx playwright install chromium) on dev machines, NOT in CI
#     (CI mocks the discovery stack per Q7, FDQ-4). The allowBuild covers its install script.
allowBuilds:
  esbuild: true
  playwright-core: true
